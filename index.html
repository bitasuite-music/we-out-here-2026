<style>
:root{
  --bg:#0f0d12; --bg2:#171420; --card:#1c1826; --card2:#25203180; --line:#2e2839;
  --ink:#f5f1f7; --dim:#a096ab; --dim2:#6f6779;
  --acc:#ef6fae; --acc2:#5ad9c8; --live:#ff5f57; --gold:#ffc861;
  --nav:74px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);overscroll-behavior-y:none;
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0}
.hide{display:none!important}

/* ---------- top bar ---------- */
header{position:sticky;top:0;z-index:30;background:rgba(15,13,18,.94);
  backdrop-filter:saturate(150%) blur(14px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:10px;padding:11px 15px 10px}
.top h1{margin:0;font-size:13px;font-weight:800;letter-spacing:2px}
.top h1 b{color:var(--acc);font-weight:800}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;
  color:var(--dim);letter-spacing:.5px}
.clock.live{color:var(--live)}
.clock.live::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--live);margin-right:6px;vertical-align:1px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{100%{transform:rotate(360deg)}}

/* ---------- day chips ---------- */
.days{display:flex;gap:7px;padding:0 12px 10px}
.day{flex:1;padding:8px 2px 9px;border-radius:12px;background:var(--card);
  border:1px solid var(--line);text-align:center;line-height:1.1}
.day .dn{font-size:10px;font-weight:800;letter-spacing:1.3px;color:var(--dim);text-transform:uppercase}
.day .dd{font-size:19px;font-weight:800;margin-top:2px}
.day.on{background:var(--acc);border-color:var(--acc);color:#22060f}
.day.on .dn{color:#5c1236}

.subbar{display:flex;gap:8px;padding:0 12px 11px;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.seg button{padding:9px 14px;font-size:12.5px;font-weight:650;color:var(--dim);letter-spacing:.2px}
.seg button.on{background:#2c2638;color:var(--ink)}
.pill{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:9px 13px;font-size:12.5px;font-weight:650}
.pill.act{border-color:var(--acc2);color:var(--acc2)}

/* ---------- content ---------- */
main{padding:8px 12px calc(var(--nav) + env(safe-area-inset-bottom) + 26px)}
.hh{position:sticky;top:0;z-index:6;margin:16px 0 7px;padding:6px 2px;
  font-size:11.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--acc2);
  background:linear-gradient(var(--bg) 68%,rgba(15,13,18,0))}
.hh.grey{color:var(--dim2)}
.sect{margin:18px 0 8px;font-size:12px;font-weight:800;letter-spacing:2px;
  text-transform:uppercase;color:var(--dim)}
.sect.live{color:var(--live)}

.row{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;margin-bottom:6px;
  background:var(--card);border-radius:13px;border-left:3px solid var(--sc,#666);position:relative;
  overflow:hidden}
.row .tm{flex:0 0 60px;padding-top:1px}
.row .tm b{display:block;font-size:13.5px;font-weight:750;letter-spacing:-.2px}
.row .tm i{font-style:normal;font-size:11.5px;color:var(--dim)}
.row .bd{flex:1;min-width:0}
.row .nm{font-size:15px;font-weight:650;letter-spacing:-.2px;word-wrap:break-word}
.row .mt{font-size:11.5px;margin-top:3px;color:var(--dim)}
.row .mt b{font-weight:650}
.row.past{opacity:.4}
.row.playing{background:#2a2136;box-shadow:inset 0 0 0 1px rgba(255,95,87,.4)}
.prog{position:absolute;left:0;bottom:0;height:2px;background:var(--live);border-radius:0 2px 2px 0}
.star{flex:0 0 34px;height:34px;margin:-3px -4px 0 0;border-radius:50%;font-size:17px;
  line-height:34px;text-align:center;color:var(--dim2)}
.star.on{color:var(--gold)}
/* the Melomaniacs' own set */
.row.melo{background:linear-gradient(100deg,#2b2338,#1c1826);
  box-shadow:inset 0 0 0 1px rgba(255,200,97,.38)}
.row.melo .nm{color:var(--gold)}
.big.melo{position:relative;border-color:rgba(255,200,97,.45)}
.big.melo .nm{color:var(--gold)}
.mb{width:23px;height:23px;vertical-align:-4px;margin-right:7px;opacity:.95}
.big-mb{position:absolute;top:14px;right:14px;width:44px;height:44px;opacity:.5;margin:0}
.ours{margin-top:4px;font-size:10.5px;font-weight:800;letter-spacing:1.7px;
  text-transform:uppercase;color:var(--gold);opacity:.9}
.prints{margin:26px 0 4px;padding:15px 15px 13px;border:1px solid var(--line);
  border-radius:14px;background:var(--card)}
.ph{font-size:11px;font-weight:800;letter-spacing:1.9px;text-transform:uppercase;
  color:var(--dim);margin-bottom:11px}
.prints a{display:block;padding:11px 13px;margin-bottom:8px;border-radius:11px;
  background:var(--bg);border:1px solid var(--line);text-decoration:none;
  color:var(--ink);font-size:14.5px;font-weight:700}
.prints a i{display:block;margin-top:3px;font-style:normal;font-size:12px;
  font-weight:400;color:var(--dim)}
.pn{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:10px}
/* recommended — a quieter version of the same idea, no logo */
.row.rec{box-shadow:inset 0 0 0 1px rgba(120,200,190,.34)}
.row.rec .nm,.big.rec .nm{color:#8fd8cc}
.big.rec{border-color:rgba(120,200,190,.42)}
.ours.tip{color:#8fd8cc}
.clash{margin-top:5px;font-size:11px;font-weight:700;color:var(--live);letter-spacing:.3px}
.clash.soft{color:var(--gold);opacity:.85}
.ics{display:block;width:100%;margin:18px 0 4px;background:var(--card2);
  border:1px solid var(--acc2);color:var(--acc2);border-radius:12px;padding:14px;
  font-size:14px;font-weight:700;letter-spacing:.2px}
.ics:active{background:var(--acc2);color:#0d2320}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}

.big{background:linear-gradient(150deg,#2b2038,#1c1826);border-radius:16px;padding:15px 15px 14px;
  margin-bottom:8px;border:1px solid var(--line);border-left:3px solid var(--sc,#666)}
.big .nm{font-size:20px;font-weight:750;letter-spacing:-.4px;line-height:1.2}
.big .st{font-size:13px;font-weight:650;margin-top:5px}
.big .tm{font-size:12.5px;color:var(--dim);margin-top:3px}
.big .bar{margin-top:11px;height:4px;background:#3a3348;border-radius:4px;overflow:hidden}
.big .bar i{display:block;height:100%;background:var(--live)}
.big .left{font-size:11px;color:var(--dim);margin-top:6px;letter-spacing:.4px}

.hid{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:14px 0 2px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--dim);font-size:12.5px}
.hid button{flex:none;border:0;border-radius:99px;padding:7px 13px;font:inherit;
  font-weight:700;background:var(--acc);color:#fff;cursor:pointer;-webkit-appearance:none}
.jump{display:block;width:100%;margin:2px 0 4px;padding:14px;border:1px solid var(--line);
  border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:14.5px;
  font-weight:700;letter-spacing:.3px;cursor:pointer;-webkit-appearance:none}
.jump:active{background:var(--line)}
.note{text-align:center;color:var(--dim);font-size:13.5px;padding:38px 22px;line-height:1.65}
.note b{color:var(--ink);display:block;font-size:17px;margin-bottom:7px;font-weight:700}
.cd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;
  text-align:center;margin:14px 0 4px}
.cd .n{font-size:34px;font-weight:800;letter-spacing:-1px;color:var(--acc)}
.cd .l{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);margin-top:3px}

.srch{display:flex;gap:9px;padding:0 12px 11px}
.srch input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;color:var(--ink);font-size:15px;outline:none}
.srch input:focus{border-color:var(--acc)}
.srch input::placeholder{color:var(--dim2)}

/* ---------- filter sheet ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none}
.sheet.open{display:block}
.sheet .in{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow:auto;background:var(--bg2);

.sheet h3{margin:2px 2px 12px;font-size:15px;font-weight:700}
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.quick button{flex:1 1 28%;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:11px 6px;font-size:12.5px;font-weight:650}
.grp{margin:14px 2px 8px;font-size:10.5px;font-weight:800;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--dim2)}
.grp:first-child{margin-top:0}
.chk{display:flex;align-items:center;gap:11px;padding:12px;margin-bottom:6px;background:var(--card);
  border-radius:11px;font-size:14px}
.chk i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.chk b{margin-left:auto;color:var(--acc2);font-size:16px;visibility:hidden}
.chk.on b{visibility:visible}
.chk:not(.on){opacity:.42}
.done{position:sticky;bottom:0;width:100%;background:var(--acc);color:#22060f;border-radius:12px;
  padding:14px;font-size:14.5px;font-weight:800;margin-top:10px}

/* ---------- bottom nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:rgba(15,13,18,.96);backdrop-filter:saturate(150%) blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 2px 8px;color:var(--dim2);position:relative}
nav button .ic{display:block;height:22px;font-size:19px;line-height:22px}
nav button .lb{display:block;font-size:10px;font-weight:700;letter-spacing:.6px;margin-top:2px}
nav button.on{color:var(--acc)}
nav .badge{position:absolute;top:5px;left:50%;margin-left:6px;background:var(--gold);color:#241703;

  border-left:3px solid var(--gold);color:var(--dim);font-size:14.5px;line-height:1.6}
.nojs b{display:block;color:var(--gold);font-size:17px;font-weight:700;margin-bottom:10px}
.nojs p{margin:0 0 12px}
.nojs strong{color:var(--ink)}
.nojs em{font-style:normal;color:var(--acc2)}
.nojs .sm{font-size:12.5px;color:var(--dim2);margin:0}
.stamp{margin:14px 2px 12px;padding:11px 13px;border-radius:11px;
  background:#251d16;border:1px solid #4a3a24;
  font-size:12px;line-height:1.55;color:#c2ab8a;text-align:center}
.stamp b{color:var(--gold);font-weight:750}
.keep{margin:16px 2px 4px;padding:16px 16px 18px;background:var(--card);border-radius:13px;
  border-left:3px solid var(--gold);font-size:12.5px;line-height:1.65;color:var(--dim)}
.keep b{display:block;color:var(--gold);font-size:13px;letter-spacing:.4px;margin-bottom:6px}
.keep b:not(.in) + br{display:none}
.keep b.in{display:inline;font-size:inherit;letter-spacing:0;margin:0}
.keep .sep{margin:0 7px;color:var(--dim2)}
.keep.warn{border-left-color:var(--live)}
.keep.warn b{color:#ff8a84}

.made{display:block;text-align:center;padding:20px 18px 6px;text-decoration:none}
.made img{width:58px;height:58px;display:block;margin:0 auto 9px;opacity:.5}
.made span{display:block;font-size:9.5px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:#4e4757;line-height:1.7}
.made i{font-style:normal;color:var(--acc);opacity:.8}
.made em{font-style:normal;color:#8f8899}
.made a{color:#f5f1f7;text-decoration:none}
.made a:hover{text-decoration:underline}
.made .mx{margin-top:7px;font-size:9px;letter-spacing:1.1px;text-transform:none;color:var(--acc2);opacity:.7}
.made .mx a{color:var(--acc2);text-decoration:none;opacity:1}
.made span i a{color:var(--acc);text-decoration:none;opacity:1}
.made:active img{opacity:.85}
.made:active .mx{opacity:1}

/* ---------- offline-ready pill ---------- */
#offp{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);
  bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom));z-index:60;
  width:max-content;max-width:calc(100% - 28px);padding:9px 15px;border-radius:999px;
  background:#1c1826f2;border:1px solid var(--line);color:var(--ink);
  font-size:12px;font-weight:600;letter-spacing:.2px;text-align:center;
  box-shadow:0 6px 22px #0009;backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:opacity .28s,transform .28s}
#offp.on{opacity:1;transform:translateX(-50%) translateY(0)}
#offp b{color:var(--acc2);font-weight:700}
#offp.warnp{border-radius:15px;padding:11px 16px;line-height:1.5;
  background:#241c14f2;border-color:#5c4a2c}
#offp.warnp b{display:block;color:var(--gold);margin-bottom:2px}

function eid(d,e){return d+'|'+e[2]+'|'+e[0]}

/* ===== clock ===== */
var TZ = 'Europe/London', _ukFmt = null, _tzOK = false;
try{
  _ukFmt = new Intl.DateTimeFormat('en-GB', {timeZone:TZ, year:'numeric', month:'2-digit',
           day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false});
  _tzOK = true;
}catch(e){ _tzOK = false; }

function z2(n){return (n<10?'0':'')+n}

function ukNow(){
  var d = new Date();
  if(!_tzOK) return {y:d.getFullYear(), mo:d.getMonth()+1, d:d.getDate(),
                     h:d.getHours(), mi:d.getMinutes()};
  var p = {};
  _ukFmt.formatToParts(d).forEach(function(x){ p[x.type] = x.value });
  return {y:+p.year, mo:+p.month, d:+p.day, h:(+p.hour)%24, mi:+p.minute};
}

function awayFromUK(){
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone !== TZ }catch(e){ return false }
}

function nowMin(){var u=ukNow(), t=u.h*60+u.mi; return t<360 ? t+1440 : t}

function liveDay(){
  var u=ukNow(), y=u.y, mo=u.mo, d=u.d;
  if(u.h<6){
    var p=new Date(Date.UTC(y, mo-1, d)); p.setUTCDate(p.getUTCDate()-1);
    y=p.getUTCFullYear(); mo=p.getUTCMonth()+1; d=p.getUTCDate();
  }
  var s=y+'-'+z2(mo)+'-'+z2(d);
  for(var i=0;i<DATA.length;i++) if(DATA[i].date===s) return i;
  return -1}

function daysUntil(){
  var u=ukNow(), today=Date.UTC(u.y, u.mo-1, u.d);
  var s=DATA[0].date.split('-'), first=Date.UTC(+s[0], +s[1]-1, +s[2]);
  return Math.round((first-today)/864e5)}

/* ===== row builders ===== */
function clashWith(d,e){
  var day=DATA[d].ev, id=eid(d,e);
  for(var i=0;i<day.length;i++){var o=day[i];
    if(eid(d,o)===id)continue;
    if(fav[eid(d,o)] && o[0]<e[1] && e[0]<o[1]) return o[3]}
  return null}

var MELO=/Melomaniacs/i;
var REC=/Ahluwalia|Sway of the Verses/i;

function rowHTML(d,e,opt){
  opt=opt||{};
  var id=eid(d,e), live=opt.live===undefined?-1:opt.live;
  var playing=live>=0&&e[0]<=live&&e[1]>live, past=live>=0&&e[1]<=live;
  var pct=playing?Math.round((live-e[0])/(e[1]-e[0])*100):0;
  var meta=[];
  if(opt.showStage!==false)meta.push('<b style="color:'+col(e[2])+'">'+esc(STAGES[e[2]])+'</b>');
  if(opt.showDay)meta.push(DATA[d].dn+' '+DATA[d].dd);
  var clash=opt.clash!==undefined?opt.clash:(fav[id]?null:clashWith(d,e));
  var lbl=(fav[id]?'Remove ':'Add ')+e[3]+(fav[id]?' from':' to')+' my plan';
  var melo=MELO.test(e[3]), rec=!melo&&REC.test(e[3]);
  return '<div class="row'+(playing?' playing':'')+(past&&!playing?' past':'')+
    (melo?' melo':'')+(rec?' rec':'')+'" style="--sc:'+col(e[2])+'">'+
    '<div class="tm"><b>'+hhmm(e[0])+'</b><i>'+hhmm(e[1])+'</i></div>'+
    '<div class="bd"><div class="nm">'+
      (melo?'<img class="mb" src="'+LOGO+'" alt="">':'')+
      esc(e[3])+'</div>'+
    (melo?'<div class="ours">★ Unmissable</div>':'')+
    (rec?'<div class="ours tip">★ Recommended</div>':'')+
    (meta.length?'<div class="mt">'+meta.join(' · ')+'</div>':'')+
    (clash?'<div class="clash'+(fav[id]?'':' soft')+'">⚠ CLASHES WITH '+
       esc(clash).toUpperCase()+'</div>':'')+
    '</div>'+
    '<button class="star'+(fav[id]?' on':'')+'" data-f="'+id+'" type="button"'+
      ' aria-pressed="'+(fav[id]?'true':'false')+'" aria-label="'+esc(lbl)+'">'+
      (fav[id]?'★':'☆')+'</button>'+
    (playing?'<i class="prog" style="width:'+pct+'%"></i>':'')+'</div>'}

function bigHTML(d,e,live){
  var pct=Math.round((live-e[0])/(e[1]-e[0])*100), left=e[1]-live;
  var id=eid(d,e), melo=MELO.test(e[3]), rec=!melo&&REC.test(e[3]);
  return '<div class="big'+(melo?' melo':'')+(rec?' rec':'')+'" style="--sc:'+col(e[2])+'">'+
    (melo?'<img class="mb big-mb" src="'+LOGO+'" alt="">':'')+
    '<div class="nm">'+esc(e[3])+'</div>'+
    (melo?'<div class="ours">★ Unmissable — on now</div>':'')+
    (rec?'<div class="ours tip">★ Recommended — on now</div>':'')+
    '<div class="st" style="color:'+col(e[2])+'">'+esc(STAGES[e[2]])+'</div>'+
    '<div class="tm">'+hhmm(e[0])+' – '+hhmm(e[1])+'</div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="left">'+left+' MIN LEFT'+(fav[id]?' · ★ ON YOUR PLAN':'')+'</div></div>'}

function icsStamp(dateStr,mins){
  var p=dateStr.split('-');
  var ms=Date.UTC(+p[0],+p[1]-1,+p[2]) - 60*60000 + mins*60000;
  var d=new Date(ms), z=function(v){return (v<10?'0':'')+v};
  return d.getUTCFullYear()+z(d.getUTCMonth()+1)+z(d.getUTCDate())+'T'+
         z(d.getUTCHours())+z(d.getUTCMinutes())+'00Z'}

function buildICS(){
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//We Out Here 2026//EN',
         'CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:We Out Here 2026'];
  var stamp=icsStamp(DATA[0].date,0), k=0;
  for(var d=0;d<DATA.length;d++){
    var picks=DATA[d].ev.filter(function(e){return fav[eid(d,e)]});
    picks.sort(function(a,b){return a[0]-b[0]});
    for(var i=0;i<picks.length;i++){
      var e=picks[i];
      var esc2=function(s){return String(s).replace(/[\\;,]/g,function(m){return '\\'+m})
        .replace(/\n/g,'\\n')};
      L.push('BEGIN:VEVENT',
        'UID:woh26-'+d+'-'+e[2]+'-'+e[0]+'@weouthere',
        'DTSTAMP:'+stamp,
        'DTSTART:'+icsStamp(DATA[d].date,e[0]),
        'DTEND:'+icsStamp(DATA[d].date,e[1]),
        'SUMMARY:'+esc2(e[3]),
        'LOCATION:'+esc2(STAGES[e[2]]+', We Out Here, Wimborne St Giles'),
        'DESCRIPTION:'+esc2(STAGES[e[2]]),
        'BEGIN:VALARM','TRIGGER:-PT15M','ACTION:DISPLAY',
        'DESCRIPTION:'+esc2(e[3]+' starts in 15 minutes'),'END:VALARM',
        'END:VEVENT');
      k++}}
  L.push('END:VCALENDAR');
  return {text:L.join('\r\n'),count:k}}

function exportICS(){
  var r=buildICS();
  if(!r.count)return;
  try{
    var blob=new Blob([r.text],{type:'text/calendar;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='we-out-here-2026-my-plan.ics';
    document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
  }catch(err){
    alert('Could not create the file here. Try opening this page in Chrome rather than a file preview.')}}

var TABS=['now','line','plan','print','find'];
(function(){
  var sx,sy,tracking;
  document.addEventListener('touchstart',function(e){
    var t=e.touches[0]; sx=t.clientX; sy=t.clientY; tracking=true},{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!tracking)return;
    var dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
    if(Math.abs(dy)>Math.abs(dx)){tracking=false}},{passive:true});
  document.addEventListener('touchend',function(e){
    if(!tracking)return; tracking=false;
    var dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)<50)return;
    var i=TABS.indexOf(tab);
    if(dx<0&&i<TABS.length-1)i++;
    else if(dx>0&&i>0)i--;
    else return;
    tab=TABS[i];
    if(tab==='line'&&liveDay()>=0)day=liveDay();
    render(); window.scrollTo(0,0);
    if(tab==='find')setTimeout(function(){document.getElementById('q').focus()},60)})
})();

  if(e.target.closest('#goThu')){
    day=0; tab='line'; drawDays(); render(); window.scrollTo(0,0); return}

  // Easter egg: catch tap on Melomaniacs card (ignore star)
  var meloRow = e.target.closest('.row.melo, .big.melo');
  if (meloRow && !e.target.closest('.star')) {
    if (!window._meloClicks) window._meloClicks = 0;
    window._meloClicks++;
    if (window._meloClicks === 5) {
      showSpinningLogo();
      window._meloClicks = 0;
    }
    return;
  }

  var b=e.target.closest('.star'); if(!b)return;
  var id=b.getAttribute('data-f');
  fav[id]=!fav[id]; touched[id]=true; saveFav();
  if(IOS_TAB && fav[id] && !warnedIOS){
    warnedIOS=true;
    offPill('<b>iPhone: add to Home Screen first</b>Stars saved in Safari won’t carry over',
            7000, 'warnp');
  }
  var bd=document.getElementById('planBadge'), n=favCount();
  bd.textContent=n; bd.className='badge'+(n?'':' hide');
  var y=window.pageYOffset||document.documentElement.scrollTop||0;
  render(); window.scrollTo(0,y)});

document.getElementById('vTime').onclick=function(){view='t';
  this.className='on';document.getElementById('vStage').className='';render()};
document.getElementById('vStage').onclick=function(){view='s';
  this.className='on';document.getElementById('vTime').className='';render()};

var sheet=document.getElementById('sheet');
document.getElementById('filt').onclick=function(){
  drawChks(); sheet.className='sheet open';
  var first=sheet.querySelector('.chk'); if(first){first.setAttribute('tabindex','0');first.focus()}};
document.getElementById('qDone').onclick=closeSheet;
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet()});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&sheet.className.indexOf('open')>=0)closeSheet()});
function syncFiltPill(){
  var f=document.getElementById('filt'), all=!offCount();
  f.className='pill'+(all?'':' act');
  f.textContent=all?'Areas':'Areas ('+on.filter(Boolean).length+')'}
function closeSheet(){sheet.className='sheet';saveFilt();
  document.getElementById('filt').focus();
  syncFiltPill();
  render()}
document.getElementById('chks').addEventListener('click',function(e){
  var c=e.target.closest('.chk'); if(!c)return;
  var i=+c.getAttribute('data-s'); on[i]=!on[i];
  c.className='chk'+(on[i]?' on':'')});
document.getElementById('qAll').onclick=function(){on=on.map(function(){return true});drawChks()};
document.getElementById('qNone').onclick=function(){on=on.map(function(){return false});drawChks()};
document.getElementById('qMain').onclick=function(){on=on.map(function(_,i){return i<NMAIN});drawChks()};
document.getElementById('qMusic').onclick=function(){on=on.map(function(_,i){return i<NMUSIC});drawChks()};
document.getElementById('qWider').onclick=function(){on=on.map(function(_,i){return i>=NMUSIC});drawChks()};

var searchTimer=null;
document.getElementById('q').addEventListener('input',function(){
  var v=this.value;
  clearTimeout(searchTimer);
  searchTimer=setTimeout(function(){q=v;render()},180)});

window.addEventListener('storage', function(e){
  if(e.key!=='woh26fav') return;
  try{ fav=JSON.parse(e.newValue||'{}')||{} }catch(err){ fav={} }
  touched={};
  var bd=document.getElementById('planBadge'), n=favCount();
  bd.textContent=n; bd.className='badge'+(n?'':' hide');
  var y=window.pageYOffset||0; render(); window.scrollTo(0,y);
});

/* ===== offline ===== */
var offTimer;
function offPill(msg,hold,cls){
  var p=document.getElementById('offp'); if(!p) return;
  clearTimeout(offTimer);
  p.innerHTML=msg; p.className='on'+(cls?' '+cls:'');
  offTimer=setTimeout(function(){p.className=''}, hold||4200);
}
(function(){
  if(!('serviceWorker' in navigator)) return;
  var h=location.hostname;
  if(location.protocol!=='https:' && h!=='localhost' && h!=='127.0.0.1') return;
  var said=false;
  function ready(hold){ if(said) return; said=true; offPill('<b>✓ Ready to use offline</b>', hold) }
  navigator.serviceWorker.addEventListener('message', function(e){
    if(e.data && e.data.type==='offline-ready') ready(5000);
  });
  navigator.serviceWorker.register('sw.js').then(function(reg){
    if(navigator.serviceWorker.controller && reg.active) ready(3200);
  }).catch(function(){ /* nothing useful to tell the user */ });
})();

if(navigator.storage && navigator.storage.persist){
  try{ navigator.storage.persist() }catch(e){}
}

/* ===== boot ===== */
loadFav(); loadFilt();
var ld=liveDay(); if(ld>=0)day=ld;
drawDays(); tick(); render();
syncFiltPill();
setInterval(tick,20000);
</script></body></html>
